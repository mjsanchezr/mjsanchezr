name: Actualizar actividad

# Regenera la tarjeta de contribuciones del README una vez al dia.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actividad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar tarjeta de actividad
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_assets.py activity

      - name: Publicar si cambio
        run: |
          git add assets/activity-*.svg
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar tarjeta de actividad"
          git push
